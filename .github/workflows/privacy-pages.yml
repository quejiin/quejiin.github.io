name: Validar site estático
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node website/scripts/sync-root.mjs
      - run: node website/scripts/check.mjs
      - name: Conferir HTML publicado
        run: git diff --exit-code -- index.html privacidade.html termos.html suporte.html 404.html .nojekyll assets